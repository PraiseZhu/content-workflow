# WeWrite 写作参数（可优化）
# 复制为 writing-config.yaml，在对话中说"优化参数"让 Agent 迭代调优
# 或手动调整后用 humanness_score.py 评估
#
# 这个文件是起点，不是最优解。
# 在对话中说"优化参数"即可自动调优，每轮调整得分最低的参数。
#
# 参数分三层，对应 writing-guide.md 的反检测结构。

# ============================================================
# 一、统计反检测参数
# ============================================================

# 句子变化度 (0-1)——越高句长方差越大
# → 对抗突发性检测 [规则 1.1]
sentence_variance: 0.7

# 段落节奏
# structured: 匀称（AI默认，避免）
# wave: 长→短→长波浪
# chaotic: 剧烈长短交替（推荐）
# → 对抗突发性检测 [规则 1.3]
paragraph_rhythm: "chaotic"

# 词汇温度偏向
# cold: 偏专业书面
# warm: 偏日常口语
# hot: 偏网络用语
# balanced: 均匀混搭（推荐）
# → 对抗词汇丰富度检测 [规则 1.2]
# [2026-10-12 停用] 去AI味改版：这是"装人味"参数，humanness_score 只报告不计分，写作时不再按配额执行。保留键名只为兼容旧脚本。
word_temperature_bias: "cold"  # 书面技术语为主，见 writing-guide 1.2

# 情绪弧线
# flat: 全程平稳（AI默认，避免）
# gradual: 缓慢升温
# restrained_to_burst: 克制→爆发（推荐）
# volatile: 剧烈波动
# → 对抗情感分布检测 [规则 1.4]
# [2026-10-12] 改为 gradual：克制，不唱苦情戏（playbook R001）
emotional_arc: "gradual"

# 负面情绪最低占比 (0-1)
# AI 中文文本负面情绪仅 11-12%，人类 25-34%
# → 对抗情感分布检测 [规则 1.4]
# [2026-10-12 停用] 去AI味改版：这是"装人味"参数，humanness_score 只报告不计分，写作时不再按配额执行。保留键名只为兼容旧脚本。
negative_emotion_floor: 0.0  # 改为"每个 H2 一处有代价的判断"，见 1.4

# 副词密度上限——每 100 字最多几个副词
# AI 中文文本副词显著偏多
# → 对抗词性分布检测 [规则 1.5]
adverb_max_per_100: 3

# 段落间风格漂移强度 (0-1)
# 0 = 全文风格一致（AI默认，避免）
# 1 = 每个 H2 段落语气/正式度明显不同
# → 对抗风格一致性检测 [规则 1.6]
style_drift: 0.6

# ============================================================
# 二、语言参数（2026-10-12 起目标是读者感受，不是检测器）
# ============================================================

# 破句/不完整句比率——每 1000 字出现几次
# → 对抗语法完美性检测 [规则 2.2]
# [2026-10-12 停用] 去AI味改版：这是"装人味"参数，humanness_score 只报告不计分，写作时不再按配额执行。保留键名只为兼容旧脚本。
broken_sentence_rate: 0.0  # 禁止表演式破句，见 2.2

# 自我纠正频率——"不对，准确说是..."
# → 对抗语法完美性检测 [规则 2.2]
# [2026-10-12 停用] 去AI味改版：这是"装人味"参数，humanness_score 只报告不计分，写作时不再按配额执行。保留键名只为兼容旧脚本。
self_correction_rate: 0.0  # 禁止编造式自我纠正，见 2.2

# 意外用词频率——每 1000 字出现几次非常规但说得通的表达
# → 对抗困惑度检测 [规则 2.3]
# [2026-10-12 停用] 去AI味改版：这是"装人味"参数，humanness_score 只报告不计分，写作时不再按配额执行。保留键名只为兼容旧脚本。
unexpected_word_rate: 0.0  # 不生造词，见 2.3

# 口语填充词风格
# literary: 坦白讲、怎么说呢
# casual: 说白了、懂的都懂
# mixed: 混合（推荐）
# minimal: 尽量少用
# [2026-10-12] 改为 minimal：说白了/说实话类口头禅全文最多 1 次，见 2.1
filler_style: "minimal"

# 跑题频率
# never / every_500_chars / every_800_chars / every_1200_chars
# → 对抗连贯性检测 [规则 2.4]
# [2026-10-12 停用] 去AI味改版：这是"装人味"参数，humanness_score 只报告不计分，写作时不再按配额执行。保留键名只为兼容旧脚本。
tangent_frequency: "never"  # 不故意跑题，见 2.4

# 结构线性度 (0-1)
# 0 = 完全非线性（跳跃、倒叙、插叙）
# 1 = 完全线性（观点→论据→总结，AI默认）
# → 对抗连贯性检测 [规则 2.4]
# [2026-10-12] 改为 0.7：论点之间要逻辑咬合（playbook R006），不为对抗检测故意跳跃
structure_linearity: 0.7

# ============================================================
# 三、内容参数
# ============================================================

# 真实数据引用密度
# low: 每 H2 段 1 条
# medium: 每 H2 段 2 条
# high: 每 H2 段 3 条+（推荐）
# → 对抗 token 概率分布检测 [规则 3.1]
real_data_density: "high"

# 成语/俗语密度——每段平均出现几次
idiom_density: 0.15

# 开头策略
# scene: 场景描写
# data: 数据冲击
# question: 反问
# anecdote: 个人经历
# cold_open: 冷开场（直接切入）
# [2026-10-12] 改为 cold_open：第一段直接给问题或判断，不演场景（playbook R001）
opening_style: "cold_open"

# 收尾策略
# summary: 总结回顾（AI默认，避免）
# open_question: 留一个没答案的问题
# image: 用一个画面收束
# abrupt: 戛然而止
closing_style: "open_question"

# 写作人设——影响整体语感和视角
persona: "科技媒体资深编辑，写了八年公众号，对AI行业有深度认知"
